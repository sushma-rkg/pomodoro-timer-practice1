<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 1 - Gallery Wall</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #5a4651;
      background: #f3dfe2;
    }
    .view {
      position: relative;
      min-height: 100vh;
      padding: 56px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: linear-gradient(180deg, #fdeaea 0%, #fbdcd2 100%);
      border-bottom: 6px solid #fff;
    }
    .tag {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.7);
      padding: 5px 12px;
      border-radius: 999px;
    }
    /* --r is the painting's width divided by its height (0.8 = tall, 1.5 = wide).
       The painting sets its own size, and the frame wraps around it. */
    .frame {
      --r: 0.8;
      --max-h: 58vh;
      width: fit-content;
      background: #fff;
      padding: 14px;
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(120, 70, 80, 0.22);
    }
    .frame.wide { --r: 1.5; }
    .frame.tall { --r: 0.6; }
    .frame.square { --r: 1; }
    .art {
      width: min(calc(86vw - 28px), calc(var(--max-h) * var(--r)), 520px);
      aspect-ratio: var(--r);
      overflow: hidden;
      position: relative;
      background: #e9b8c4;
    }
    .art::before {
      content: "";
      position: absolute;
      inset: -30px;
      background:
        radial-gradient(circle at 30% 30%, #ffd9a8 0 18%, transparent 19%),
        linear-gradient(160deg, #f4a6b8 0%, #c9a7e0 55%, #9fc7e8 100%);
    }
    .blur-heavy::before { filter: blur(24px); }
    .blur-medium::before { filter: blur(10px); }
    .loading { background: linear-gradient(100deg, #f3d9de 30%, #fff3f5 50%, #f3d9de 70%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
    .loading::before { display: none; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .timer {
      font-size: clamp(48px, 12vw, 72px);
      font-weight: 300;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .buttons { display: flex; gap: 12px; }
    .btn {
      font: inherit;
      font-size: 16px;
      padding: 12px 30px;
      border-radius: 999px;
      border: 2px solid #e7a9b6;
      background: #fff;
      color: #5a4651;
    }
    .btn.main { background: #e7a9b6; color: #fff; border-color: #e7a9b6; }
    .label {
      text-align: center;
      line-height: 1.5;
    }
    .label .name { font-size: 20px; font-weight: 600; margin: 0; }
    .label .meta { font-size: 15px; margin: 2px 0 0; opacity: 0.85; }
    .status { margin: 0; font-size: 16px; opacity: 0.8; }

    @media (min-width: 900px) {
      .frame { --max-h: 62vh; }
      .art { width: min(calc(var(--max-h) * var(--r)), 640px); }
    }
  </style>
</head>
<body>

  <section class="view">
    <span class="tag">Before starting</span>
    <div class="frame"><div class="art blur-heavy"></div></div>
    <p class="timer">25:00</p>
    <div class="buttons">
      <button class="btn main">Start</button>
      <button class="btn">Reset</button>
    </div>
  </section>

  <section class="view">
    <span class="tag">Loading artwork...</span>
    <div class="frame"><div class="art loading"></div></div>
    <p class="status">Loading artwork...</p>
    <p class="timer">25:00</p>
  </section>

  <section class="view">
    <span class="tag">Timer running</span>
    <div class="frame"><div class="art blur-medium"></div></div>
    <p class="timer">18:42</p>
    <div class="buttons">
      <button class="btn main">Pause</button>
      <button class="btn">Reset</button>
    </div>
  </section>

  <section class="view">
    <span class="tag">Timer finished</span>
    <div class="frame"><div class="art"></div></div>
    <div class="label">
      <p class="name">Evening Over the Water</p>
      <p class="meta">Marguerite Bellaire, 1887</p>
    </div>
    <p class="timer">00:00</p>
    <div class="buttons">
      <button class="btn main">Restart session</button>
    </div>
  </section>

  <section class="view">
    <span class="tag">Frame example: wide painting</span>
    <div class="frame wide"><div class="art blur-medium"></div></div>
    <p class="timer">18:42</p>
    <div class="buttons">
      <button class="btn main">Pause</button>
      <button class="btn">Reset</button>
    </div>
  </section>

  <section class="view">
    <span class="tag">Frame example: tall painting</span>
    <div class="frame tall"><div class="art blur-medium"></div></div>
    <p class="timer">18:42</p>
    <div class="buttons">
      <button class="btn main">Pause</button>
      <button class="btn">Reset</button>
    </div>
  </section>

  <section class="view">
    <span class="tag">Frame example: square painting</span>
    <div class="frame square"><div class="art blur-medium"></div></div>
    <p class="timer">18:42</p>
    <div class="buttons">
      <button class="btn main">Pause</button>
      <button class="btn">Reset</button>
    </div>
  </section>

</body>
</html>
