<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 2 - Side by Side</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #4b4560;
      background: #e6dff5;
    }
    .view {
      position: relative;
      min-height: 100vh;
      padding: 56px 16px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #efe9fb 0%, #e0d6f4 100%);
      border-bottom: 6px solid #fff;
    }
    .tag {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.7);
      padding: 5px 12px;
      border-radius: 999px;
    }
    .card {
      width: min(100%, 460px);
      background: #fff;
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(80, 60, 130, 0.18);
      display: grid;
      gap: 20px;
    }
    .art {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background: #cdb8ee;
    }
    .art::before {
      content: "";
      position: absolute;
      inset: -30px;
      background:
        radial-gradient(circle at 70% 28%, #ffe3b8 0 15%, transparent 16%),
        linear-gradient(150deg, #b9a4ec 0%, #f2b5d4 55%, #ffd9bf 100%);
    }
    .blur-heavy::before { filter: blur(24px); }
    .blur-medium::before { filter: blur(10px); }
    .loading { background: linear-gradient(100deg, #e8e0f6 30%, #faf7ff 50%, #e8e0f6 70%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
    .loading::before { display: none; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .info { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
    .timer {
      font-size: clamp(52px, 14vw, 80px);
      font-weight: 300;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      font: inherit;
      font-size: 16px;
      padding: 12px 30px;
      border-radius: 999px;
      border: 2px solid #b9a4ec;
      background: #fff;
      color: #4b4560;
    }
    .btn.main { background: #b9a4ec; color: #fff; }
    .name { font-size: 20px; font-weight: 600; margin: 0; }
    .meta { font-size: 15px; margin: 2px 0 0; opacity: 0.85; }
    .status { margin: 0; font-size: 16px; opacity: 0.8; }

    @media (min-width: 900px) {
      .card {
        width: min(94vw, 1000px);
        grid-template-columns: 1.15fr 1fr;
        gap: 36px;
        padding: 28px;
      }
      .art { aspect-ratio: 4 / 5; max-height: 72vh; }
    }
  </style>
</head>
<body>

  <section class="view">
    <span class="tag">Before starting</span>
    <div class="card">
      <div class="art blur-heavy"></div>
      <div class="info">
        <p class="timer">25:00</p>
        <div class="buttons">
          <button class="btn main">Start</button>
          <button class="btn">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view">
    <span class="tag">Loading artwork...</span>
    <div class="card">
      <div class="art loading"></div>
      <div class="info">
        <p class="status">Loading artwork...</p>
        <p class="timer">25:00</p>
      </div>
    </div>
  </section>

  <section class="view">
    <span class="tag">Timer running</span>
    <div class="card">
      <div class="art blur-medium"></div>
      <div class="info">
        <p class="timer">18:42</p>
        <div class="buttons">
          <button class="btn main">Pause</button>
          <button class="btn">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view">
    <span class="tag">Timer finished</span>
    <div class="card">
      <div class="art"></div>
      <div class="info">
        <p class="timer">00:00</p>
        <div>
          <p class="name">Evening Over the Water</p>
          <p class="meta">Marguerite Bellaire, 1887</p>
        </div>
        <div class="buttons">
          <button class="btn main">Restart session</button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
